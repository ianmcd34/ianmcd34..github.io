    <title>OXO</title>
  </head>
  <body onload="setup()">
    <h1>Hidden OXO</h1>
    <h4 id='date'></h4>
    

    <div>
        <h1 id="info">Player: X</h1>
    </div>

    <ul id="dreamingof" class="scoretable">

    </ul>

    <table>
	<tr>
    		<td class="plyer" id="P_A0" onclick="play(event)" ></td>
    		<td class="plyer" id="P_A1" onclick="play(event)"  ></td>
    		<td class="plyer" id="P_A2" onclick="play(event)"  ></td>

 	  </tr>
  	  <tr>
    		<td class="plyer" id="P_B0" onclick="play(event)"  ></td>
    		<td class="plyer" id="P_B1" onclick="play(event)"   ></td>
    		<td class="plyer" id="P_B2" onclick="play(event)"  ></td>

  	  </tr>
  	  <tr>
    		<td class="plyer" id="P_C0"  onclick="play(event)" ></td>
    		<td class="plyer" id="P_C1" onclick="play(event)"  ></td>
    		<td class="plyer" id="P_C2"  onclick="play(event)" ></td>

  	   </tr>

    <button type="button" onclick="computerPlay()">Computer Move</button>







    <script >

        const positionsMap = new Map();
        let activeKey = "";
        let playvisibly = "";

        class BoardPosition {
            static countPositions = 0;
            constructor() {
                BoardPosition.countPositions++;
                this.boardArr = [["","",""],["","",""],["","",""]];
                this.positionNumber = "_"+BoardPosition.countPositions;
                positionsMap.set(this.positionNumber, this);
            }

            clone(pointOfViewChr="") {
                var hiddenChr="";
                if (pointOfViewChr=="X") {
                    hiddenChr = "Oh";
                } else if (pointOfViewChr=="O") {
                    hiddenChr = "Xh";
                }
                const bp = new BoardPosition();
                bp.boardArr=structuredClone(this.boardArr);
                if (pointOfViewChr!="") {
                    for (var r2=0; r2<3; r2++) {
                        for (var c2=0;  c2<3; c2++) {
                            if (bp.boardArr[r2][c2]==hiddenChr) {
                                bp.boardArr[r2][c2]="";
                            }
                        }
                    }
                }
                positionsMap.delete(bp.positionNumber);
                bp.positionNumber = this.positionNumber+bp.positionNumber;
                positionsMap.set(bp.positionNumber, bp);
                return bp;
            }

            setPosition(playerChr, position) {

                if (this.boardArr[position[0]][position[1]]!="" && this.boardArr[position[0]][position[1]].charAt(0)!=playerChr.charAt(0)) {
                    return false;
                } else {
                    this.boardArr[position[0]][position[1]]=playerChr;
                    return true;
                }
            }

            unhide(position) {
                if (this.boardArr[position[0]][position[1]].length!=2) {
                    return false;
                }
                this.boardArr[position[0]][position[1]]=this.boardArr[position[0]][position[1]].charAt(0);
            }

            unhideBoard() {
                for (var r1=0; r1<3; r1++) {
                    for (var c1=0; c1<3; c1++) {
                        this.unhide([r1,c1]);
                    }
                }
            }


            

            weHaveAWinner(playerChr) {

                var winnervisibleonly=false;
                var winnerincludinghidden=false;
                if (this.boardArr[0][0]==playerChr && this.boardArr[0][1]==playerChr && this.boardArr[0][2]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[1][0]==playerChr && this.boardArr[1][1]==playerChr && this.boardArr[1][2]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[2][0]==playerChr && this.boardArr[2][1]==playerChr && this.boardArr[2][2]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[0][0]==playerChr && this.boardArr[1][0]==playerChr && this.boardArr[2][0]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[0][1]==playerChr && this.boardArr[1][1]==playerChr && this.boardArr[2][1]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[0][2]==playerChr && this.boardArr[1][2]==playerChr && this.boardArr[2][2]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[0][0]==playerChr && this.boardArr[1][1]==playerChr && this.boardArr[2][2]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[0][2]==playerChr && this.boardArr[1][1]==playerChr && this.boardArr[2][0]==playerChr) {
                    winnervisibleonly=true;
                }
                if (this.boardArr[0][0].charAt(0)==playerChr && this.boardArr[0][1].charAt(0)==playerChr && this.boardArr[0][2].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                if (this.boardArr[1][0].charAt(0)==playerChr && this.boardArr[1][1].charAt(0)==playerChr && this.boardArr[1][2].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                if (this.boardArr[2][0].charAt(0)==playerChr && this.boardArr[2][1].charAt(0)==playerChr && this.boardArr[2][2].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                if (this.boardArr[0][0].charAt(0)==playerChr && this.boardArr[1][0].charAt(0)==playerChr && this.boardArr[2][0].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                if (this.boardArr[0][1].charAt(0)==playerChr && this.boardArr[1][1].charAt(0)==playerChr && this.boardArr[2][1].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                if (this.boardArr[0][2].charAt(0)==playerChr && this.boardArr[1][2].charAt(0)==playerChr && this.boardArr[2][2].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                if (this.boardArr[0][0].charAt(0)==playerChr && this.boardArr[1][1].charAt(0)==playerChr && this.boardArr[2][2].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                if (this.boardArr[0][2].charAt(0)==playerChr && this.boardArr[1][1].charAt(0)==playerChr && this.boardArr[2][0].charAt(0)==playerChr) {
                    winnerincludinghidden=true;
                }
                return [winnervisibleonly, winnerincludinghidden];
            }
        }

        function setup() {
            activeBP = new BoardPosition();
            activeKey = activeBP.positionNumber;
        }
        

        function play(ev)  {
            player = document.getElementById("info").innerHTML.charAt(8);
            activeBP = positionsMap.get(activeKey);
            nextBP = activeBP.clone();
            activeKey = nextBP.positionNumber;

            tile = document.getElementById(ev.target.id);

            if (ev.target.id.charAt(2)=="A") {
                row=0;
            }
            if (ev.target.id.charAt(2)=="B") {
                row=1;
            }
            if (ev.target.id.charAt(2)=="C") {
                row=2;
            }
            column = parseInt(ev.target.id.charAt(3));

            if (activeBP.boardArr[row][column]=="") {
                
                if (player==playvisibly) {
                    tile.innerHTML = player;
                    nextBP.setPosition(player, [row, column]);
                    playvisibly = "";
                } else {
                    nextBP.setPosition(player+"h", [row, column]);
                }

                //dreamingOf(activeKey);

                if (nextBP.weHaveAWinner(player)[1]) {
                    nextBP.unhideBoard();
                    drawBoard();
                    alert("Game Over!");
                }

                if (player=="X") {
                    player = "O";
                } else {
                    player = "X";
                }

                document.getElementById("info").innerHTML = "Player: "+player;
                
                return;
                
            } else if (activeBP.boardArr[row][column].length==2) {
                //alert("line315");
                tile.innerHTML=activeBP.boardArr[row][column].charAt(0);
                nextBP.unhide([row, column]);
                drawBoard();
                playvisibly = player;
                //dreamingOf(activeKey);
                return;
            } else {
                alert("line323");
                return;
            }

            


        }

        function computerPlay() {
            player = document.getElementById("info").innerHTML.charAt(8);
            if (player=="X") {
                opponent="O";
                hiddenChr = "Oh";
            } else {
                opponent="X";
                hiddenChr = "Xh";
            }
            activeBP = positionsMap.get(activeKey);


            nextBpArr=[];
            nextNextBpArr=[];

            toplay="";
            stopsearch=false;
            for (r1=0; r1<3; r1++) {
                for (c1=0; c1<3; c1++) {

                    if (activeBP.boardArr[r1][c1]=="" || activeBP.boardArr[r1][c1]==hiddenChr) {
                        nextBP = activeBP.clone(player);
                        nextBP.setPosition(player, [r1, c1]);
                        

                        nextBpArr.push(nextBP.positionNumber);
                        nextBP = activeBP.clone(player);
                        nextBP.setPosition(opponent, [r1, c1]);
                        

                        nextBpArr.push(nextBP.positionNumber);
                    }
                }
            }
            winlose = checkPositions(structuredClone(nextBpArr), player);


            if (winlose[0].length>0) {
                //alert("toplay1="+toplay);
                /* found winning move - stop and play it*/
                winindx = winlose[0][Math.floor(Math.random()*winlose[0].length)];
                toplay=nextBpArr[winindx];
                //alert("toplay2="+toplay);
                stopsearch=true;
            } else if (winlose[1].length>0) {
                //alert("block losing move");
                /* found losing move - stop and block it*/
                loseindx = winlose[1][Math.floor(Math.random()*winlose[1].length)];
                toplay=nextBpArr[loseindx];
                nextBP=positionsMap.get(toplay);
                for (i1 in activeBP.boardArr) {
                    for (j1 in activeBP.boardArr[i1]) {                    
                        if (activeBP.boardArr[i1][j1]!=opponent && nextBP.boardArr[i1][j1]==opponent) {
                            nextBP.boardArr[i1][j1]=player;
                        }
                    }
                }
                stopsearch=true;
            } else {
                /* play any position that has the possibility of 3 in a row */
                for (p1 in nextBpArr) {      
                    nextBP=positionsMap.get(nextBpArr[p1]);
                    for (r1=0; r1<3; r1++) {
                        for (c1=0; c1<3; c1++) {

                            if (nextBP.boardArr[r1][c1]=="" || nextBP.boardArr[r1][c1]==hiddenChr) {
                                nextNextBP = nextBP.clone(player);
                                nextNextBP.setPosition(player, [r1, c1]);
                                nextNextBpArr.push(nextNextBP.positionNumber);
                            }
                        }
                    }
                }
                winlose = checkPositions(structuredClone(nextNextBpArr), player);
                if (winlose[0].length>0) {
                    //alert("toplay3="+toplay);
                    //alert("winlose0="+winlose[0])
                    /* found winning move - stop and play it*/
                    winindx = winlose[0][0][Math.floor(Math.random()*winlose[0][0].length)];
                    //alert("winindx="+winindx);
                    //alert(nextNextBpArr);
                    toplay=nextNextBpArr[winindx];
                    //alert("toplay4="+toplay);
                    stopsearch=true;
                }
                
            }

            //alert("toplay="+toplay);
            if (toplay=="") {
                completeArr = [];
                for (r1=0; r1<3; r1++) {
                    for (c1=0; c1<3; c1++) {

                        if (activeBP.boardArr[r1][c1]=="") {
                            nextBP = activeBP.clone();
                            nextBP.setPosition(player, [r1, c1]);
                            completeArr.push(nextBP.positionNumber);
                        }
                    }
                }
                toplay =  completeArr[Math.floor(Math.random()*completeArr.length)];

            }
            if (toplay=="") {
                alert("Game Over!");
                return;
            }
            


            toplay = toplay.replace(activeKey,"");

   
            if (toplay.indexOf("_",2)>-1) {
                toplay = activeKey+toplay.substring(0,toplay.indexOf("_",2));
            } else {
                toplay = activeKey+toplay;
            }
            //dreamingOf(toplay);
            
            if (toplay==activeKey) {
                nextBpArr.length=0;
                for (r1=0; r1<3; r1++) {
                    for (c1=0; c1<3; c1++) {

                        if (activeBP.boardArr[r1][c1]=="" || activeBP.boardArr[r1][c1]==hiddenChr) {
                            nextBP = activeBP.clone(player);
                            nextBP.setPosition(player, [r1, c1]);

                            nextBpArr.push(nextBP.positionNumber);
                        }
                    }
                }
                toplay=nextBpArr[Math.floor(Math.random()*nextBpArr.length)];

            }


            testBP = positionsMap.get(toplay);
            nextBP =  activeBP.clone();

            
            
            foundempty=false;
            foundemptytile="";
            foundemptytile1="";
            for (r1=0; r1<3; r1++) {
                for (c1=0; c1<3; c1++) {
                    id = "P_"+"ABC".charAt(r1)+"012".charAt(c1);

                    if (document.getElementById(id).innerHTML!=testBP.boardArr[r1][c1]) {

                        if (document.getElementById(id).innerHTML=="" && activeBP.boardArr[r1][c1]==""  && testBP.boardArr[r1][c1].charAt(0)==player) {
                            foundempty=true;
                            foundemptytile=id;
                        } else if (document.getElementById(id).innerHTML=="" && activeBP.boardArr[r1][c1]==hiddenChr  && testBP.boardArr[r1][c1].charAt(0)==player) {
                            foundempty=true;
                            foundemptytile1=id;
                        }

                    }
                }
            }
            //alert("foundempty"+foundempty+","+foundemptytile+","+foundemptytile1);
            if (foundempty) {
                if (foundemptytile!="") {
                    if (foundemptytile.charAt(2)=="A") {
                        row=0;
                    }
                    if (foundemptytile.charAt(2)=="B") {
                        row=1;
                    }
                    if (foundemptytile.charAt(2)=="C") {
                        row=2;
                    }
                    column = parseInt(foundemptytile.charAt(3));
                    //alert("playvisibly"+player+"=?"+playvisibly);
                    if (player==playvisibly) {
                        
                        nextBP.setPosition(player, [row, column]);
                        document.getElementById(foundemptytile).innerHTML = nextBP.boardArr[row][column];
                        playvisibly = "";
                    } else {
                        //alert("play hidden");
                        pchr=player+"h";
                        nextBP.setPosition(pchr, [row, column]);
                    }
                    activeKey=nextBP.positionNumber;

                    
                    //dreamingOf(activeKey);
                    if (nextBP.weHaveAWinner(player)[1]) {
                        nextBP.unhideBoard();
                        drawBoard();
                        alert("Game Over!");
                    }
                    if (player=="X") {
                        player = "O";
                    } else {
                        player = "X";
                    }

                    document.getElementById("info").innerHTML = "Player: "+player;

                    
                } else {
                    if (foundemptytile1.charAt(2)=="A") {
                        row=0;
                    }
                    if (foundemptytile1.charAt(2)=="B") {
                        row=1;
                    }
                    if (foundemptytile1.charAt(2)=="C") {
                        row=2;
                    }
                    column = parseInt(foundemptytile1.charAt(3));
                    tile=document.getElementById(foundemptytile1);
                    tile.innerHTML=activeBP.boardArr[row][column].charAt(0);
                    activeBP.unhide([row, column]);
                    //drawBoard();
                    playvisibly = player;
                    //dreamingOf(activeKey);

                }
            } else {
                alert("no empty tile found");
            }
            
            

        }

        function checkPositions(arr1, player1) {
            if (player1=="X") {
                otherplayer="O";
            } else {
                otherplayer="X";
            }
            winningpositionArr=[];
            losingpositionArr=[];
            for (p1 in arr1) {
                nextBP = positionsMap.get(arr1[p1]);
                if (nextBP.weHaveAWinner(player1)[1]) {
                    winningpositionArr.push(p1);
                }
                if (nextBP.weHaveAWinner(otherplayer)[0]) {
                    losingpositionArr.push(p1);
                }
            }
            return [winningpositionArr,losingpositionArr];
        }

        function opponentMove(nextBpArr, player1) {
            if (player1=="X") {
                otherplayer="O";
            } else {
                otherplayer="X";
            }
            toAddBpArr=[];
            for (p1 in nextBpArr) {  
                activeBP = positionsMap.get(nextBpArr[p1]);    
                for (r1=0; r1<3; r1++) {
                    for (c1=0; c1<3; c1++) {       
                        if (activeBP.boardArr[r1][c1].length!=1) {
                            toAddBP = activeBP.clone(otherplayer);
                            toAddBP.setPosition(otherplayer, [r1, c1]);
                            toAddBpArr.push(toAddBP.positionNumber);
                        }
                    }
                }
            }
            return toAddBpArr;
        }

        function playerMove(toAddBpArr, player1) {
            if (player1=="X") {
                otherplayer="O";
            } else {
                otherplayer="X";
            }
            if (player1=="X") {
                hiddenChr = "Oh";
            } else {
                hiddenChr = "Xh";
            }
            nextBpArr=[];
            for (p1 in toAddBpArr) {  
                activeBP = positionsMap.get(toAddBpArr[p1]);    
                for (r1=0; r1<3; r1++) {
                    for (c1=0; c1<3; c1++) {       
                        if (activeBP.boardArr[r1][c1]=="" || activeBP.boardArr[r1][c1]==hiddenChr) {
                            nextBP = activeBP.clone(player1);
                            nextBP.setPosition(player1, [r1, c1]);
                            nextBpArr.push(nextBP.positionNumber);
                        }
                    }
                }
            }
            return nextBpArr;
        }

        function drawBoard() {
            activeBP = positionsMap.get(activeKey);
            for (r1=0; r1<3; r1++) {
                for (c1=0; c1<3; c1++) {
                    id = "P_"+"ABC".charAt(r1)+"012".charAt(c1);
                    if (activeBP.boardArr[r1][c1].length==1) {
                        document.getElementById(id).innerHTML = nextBP.boardArr[r1][c1];
                    }
                }
            }

        }




        function dreamingOf(key1) {
            list = document.getElementById("dreamingof");

            // while(key1.length>1) {
                bp = positionsMap.get(key1);
                newLi = document.createElement("li");
                newLi.innerHTML = key1+" "+JSON.stringify(bp.boardArr);
                list.appendChild(newLi);
            //     key1 = key1.substring(0,key1.lastIndexOf("_"));
            // }
        }


        function findPosition() {
            key1 = document.getElementById("findposn").value;
            bp = positionsMap.get(key1);
            nextBpArr=[key1];
            toAddBpArr=opponentMove([key1], "O");
            winloseopponent = checkPositions(structuredClone(toAddBpArr), "O");

            stub = toAddBpArr[winloseopponent[1][0]].substring(0, toAddBpArr[winloseopponent[1][0]].lastIndexOf("_"));
            nextBpArr.splice(nextBpArr.indexOf(stub),1);

        }

        








    </script>
